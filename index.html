<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="PojazdLex — informacje dotyczące rejestracji i spraw pojazdów."
    />
    <meta
      name="keywords"
      content="rejestracja pojazdów, kary, wnioski, zawiadomienie o zbyciu pojazdu"
    />
    <meta name="author" content="Konrad Konik" />
    <script>
      (() => {
        const storageKey = "motolex-theme";
        const availableThemes = ["light", "dark", "high-contrast"];

        try {
          const savedTheme = localStorage.getItem(storageKey);
          const systemTheme = matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
          const theme = availableThemes.includes(savedTheme)
            ? savedTheme
            : systemTheme;

          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme =
            theme === "light" ? "light" : "dark";
        } catch {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <title>MotoLex</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
